[/Script/EngineSettings.GameMapsSettings]
; Venue flow: Quest always boots to wait lobby. Master must approve/START before Outbreak.
; Solo or group — both require Master PC over Wi-Fi. No USB for play.
GameDefaultMap=/Game/LBVR/Maps/L_ClientWait.L_ClientWait
GlobalDefaultGameMode=/Game/LBVR/Blueprints/BP_ClientWaitGameMode.BP_ClientWaitGameMode_C
ServerDefaultMap=/Game/LBVR/Maps/L_MasterLobby.L_MasterLobby

[/Script/Engine.RendererSettings]
; --- Meta Quest 3 / standalone OpenXR — zero-lag mobile lock ---

; Disabling distance fields / DFAO (thermal killers on XR2).
r.DistanceFields=0
r.GenerateMeshDistanceFields=0
r.DistanceFieldAO=0
r.AOQuality=0

; Contact shadows off (compute-heavy).
r.ContactShadows=0

; Single-pass mobile rendering path required for mobile multi-view VR.
r.Mobile.AllowFramebufferFetch=1
r.Mobile.ShadingPath=0
r.Mobile.AllowDepthPrePass=1
r.Vulkan.EnableMobileMultiView=1
vr.MobileMultiView=1

; MSAA 2x — crisp Quest edges; 4x was too heavy (black frames / ~15 FPS).
r.AntiAliasingMethod=3
r.Mobile.AntiAliasing=3
r.MobileMSAA=2
r.MSAACount=2
r.MSAA.CompositingSampleCount=2

; PSO precaching is extremely slow on first launch for standalone XR devices.
r.PSOPrecaching=0

; Draw-call stability on Quest 3 (UE 5.5+): keep GPUScene, mobile AO, and occlusion queries off.
r.Mobile.EnableGPUScene=0
r.Mobile.AmbientOcclusion=0
r.AllowOcclusionQueries=0
r.OcclusionFeedback.Enable=0
r.Nanite=0

; Foveated rendering = sharper center, smooth edges — best quality-per-watt on Quest 3.
xr.VRS.DynamicFoveation=1
xr.OpenXRFBFoveationLevel=3
xr.OpenXRFBFoveationDynamic=0
r.Vulkan.VRSFormat=3
r.Vulkan.AllowFDMOffset=1
r.Android.DisableVulkanSupport=0

; Niagara GPU sim can hard-crash on standalone Quest — keep on CPU.
fx.NiagaraAllowGPUParticles=0
FX.AllowGPUSorting=0

; Tight texture streaming pool — prevents memory spikes during asset swaps.
r.Streaming.PoolSize=450
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.MaxEffectiveScreenSize=0
r.Streaming.FramesForFullUpdate=5
r.Streaming.MaxNumTexturesToStreamPerFrame=4

; Baked lighting frees GPU headroom — clearer HMD without TSR smear.
r.MobileContentScaleFactor=0.82
xr.SecondaryScreenPercentage.HMDRenderTarget=85

; Scalable quality — survival settings for complex Outbreak map + guns + AI.
sg.ViewDistanceQuality=1
sg.AntiAliasingQuality=1
sg.ShadowQuality=0
sg.GlobalIlluminationQuality=0
sg.ReflectionQuality=0
sg.PostProcessQuality=0
sg.TextureQuality=1
sg.EffectsQuality=0
sg.FoliageQuality=0
sg.LandscapeQuality=0

; VR exposure stability.
r.DefaultFeature.AutoExposure=0
r.EyeAdaptationQuality=0
r.EyeAdaptation.PreExposureOverride=1.0
r.BloomQuality=0
r.DepthOfFieldQuality=0
r.MotionBlurQuality=0
r.AmbientOcclusionLevels=0
r.DefaultFeature.AmbientOcclusion=0
r.DefaultFeature.MotionBlur=0

[ConsoleVariables]
xr.OpenXRFBFoveationLevel=3
xr.OpenXRFBFoveationDynamic=0
t.MaxFPS=72
r.MobileMSAA=2
r.MSAACount=2
r.ContactShadows=0
r.DistanceFieldAO=0
r.ShadowQuality=0
r.Mobile.AllowDepthPrePass=1
r.Vulkan.EnableMobileMultiView=1
fx.NiagaraAllowGPUParticles=0
fx.Niagara.QualityLevel=1
; Instant "crash" on Quest was often OpenXR RequestExitApp when session lost (Link / focus).
xr.OpenXRExitAppOnRuntimeDrivenSessionExit=0
