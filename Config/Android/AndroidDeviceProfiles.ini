; Project overrides for Meta Quest 3 — zero-lag / 90 FPS lock.

[Meta_Quest_3 DeviceProfile]
+CVars=r.Mobile.Oculus.ForceSymmetric=1
+CVars=r.Mobile.AdrenoOcclusionMode=1
+CVars=r.Vulkan.UseChunkedPSOCache=0

; MSAA 4x hard-lock (no TAA).
+CVars=r.AntiAliasingMethod=3
+CVars=r.Mobile.AntiAliasing=3
+CVars=r.MobileMSAA=4
+CVars=r.MSAACount=4

; Mobile multi-view + depth pre-pass.
+CVars=r.Mobile.AllowDepthPrePass=1
+CVars=r.Vulkan.EnableMobileMultiView=1
+CVars=vr.MobileMultiView=1

; Contact shadows / DFAO off.
+CVars=r.ContactShadows=0
+CVars=r.DistanceFieldAO=0
+CVars=r.DistanceFields=0
+CVars=r.GenerateMeshDistanceFields=0

; Quest 3: 94% eye buffer + 0.92 content scale — sharp but stable at 90 Hz.
+CVars=xr.SecondaryScreenPercentage.HMDRenderTarget=94
+CVars=r.MobileContentScaleFactor=0.92
+CVars=t.MaxFPS=90
+CVars=sg.ShadowQuality=1
+CVars=sg.PostProcessQuality=1
+CVars=sg.TextureQuality=2
+CVars=sg.AntiAliasingQuality=2
+CVars=sg.EffectsQuality=1
+CVars=r.Streaming.PoolSize=450
+CVars=r.Streaming.LimitPoolSizeToVRAM=1
+CVars=r.Streaming.MaxNumTexturesToStreamPerFrame=4
+CVars=r.BloomQuality=0

; Dynamic foveation — keeps frame time smooth while allowing higher base resolution.
+CVars=xr.VRS.DynamicFoveation=1

; Texture LOD: cap bandwidth (World/Prop ~1K effective, Character/Weapon ~2K).
+CVars=r.MaxAnisotropy=4
+TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=1024,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldNormalMap,MinLODSize=1,MaxLODSize=1024,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldSpecular,MinLODSize=1,MaxLODSize=1024,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_Character,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_CharacterNormalMap,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_CharacterSpecular,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_Weapon,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WeaponNormalMap,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WeaponSpecular,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_Effects,MinLODSize=1,MaxLODSize=512,LODBias=0,MinMagFilter=linear,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_Skybox,MinLODSize=1,MaxLODSize=1024,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)

