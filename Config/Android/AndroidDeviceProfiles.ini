; Project overrides for Meta Quest 3 — layered on top of Engine/Config/BaseDeviceProfiles.ini Meta_Quest_3 profile.

[Meta_Quest_3 DeviceProfile]
; Prefer Quest 3 native symmetric swapchains and Adreno occlusion path (engine defaults).
+CVars=r.Mobile.Oculus.ForceSymmetric=1
+CVars=r.Mobile.AdrenoOcclusionMode=1
+CVars=r.Vulkan.UseChunkedPSOCache=0

; Performance headroom: 90% eye buffer + conservative shadows for this lab/zombie scene.
+CVars=xr.SecondaryScreenPercentage.HMDRenderTarget=90
+CVars=r.MobileContentScaleFactor=0.85
+CVars=sg.ShadowQuality=1
+CVars=r.Streaming.PoolSize=450

; Dynamic foveation — free GPU on Quest 3 without visible quality loss in VR.
+CVars=xr.VRS.DynamicFoveation=1

[Meta_Quest_3S DeviceProfile]
+CVars=r.MobileContentScaleFactor=0.80
+CVars=xr.SecondaryScreenPercentage.HMDRenderTarget=85
+CVars=sg.ShadowQuality=0
